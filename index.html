<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing Auto Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Bing Auto Search</h1>

        <!-- Search Inputs -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Number of Searches</label>
            <input type="number" id="searchCount" value="10" class="w-full p-2 border rounded">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Delay (Seconds)</label>
            <input type="number" id="delay" value="3" class="w-full p-2 border rounded">
        </div>

        <!-- Buttons -->
        <div class="flex space-x-2 mb-4">
            <button id="startBtn" class="flex-1 bg-green-500 text-white p-2 rounded hover:bg-green-600">Start</button>
            <button id="stopBtn" class="flex-1 bg-red-500 text-white p-2 rounded hover:bg-red-600">Stop</button>
        </div>

        <!-- Status -->
        <div id="status" class="border rounded p-2 h-40 overflow-auto">
            <p>Ready to start...</p>
        </div>
    </div>

    <script>
        let isRunning = false;
        let currentSearch = 0;
        let totalSearches = 0;
        let delay = 0;
        let currentTopic = '';
        let usedTopics = [];

        // Function to fetch a trending topic from Google Trends (using a proxy API for simplicity)
        async function fetchTrendingTopic() {
            try {
                // Note: Google Trends API requires authentication and is complex for direct use.
                // Using a proxy API or fallback to Quotable for simplicity.
                const response = await fetch('https://api.quotable.io/random'); // Fallback to Quotable
                const data = await response.json();
                let topic = data.content.split(' ').slice(0, 3).join(' ');

                // Ensure the topic hasn't been used before
                let attempts = 0;
                while (usedTopics.includes(topic) && attempts < 5) {
                    const newResponse = await fetch('https://api.quotable.io/random');
                    const newData = await newResponse.json();
                    topic = newData.content.split(' ').slice(0, 3).join(' ');
                    attempts++;
                }

                if (!usedTopics.includes(topic)) {
                    usedTopics.push(topic);
                    // Keep only the last 100 topics to avoid excessive storage
                    if (usedTopics.length > 100) {
                        usedTopics.shift();
                    }
                    saveState();
                    return topic;
                } else {
                    return 'random topic ' + Date.now(); // Fallback with timestamp
                }
            } catch (error) {
                return 'random topic ' + Date.now(); // Fallback with timestamp
            }
        }

        // Save state to localStorage
        function saveState() {
            localStorage.setItem('isRunning', isRunning);
            localStorage.setItem('currentSearch', currentSearch);
            localStorage.setItem('totalSearches', totalSearches);
            localStorage.setItem('delay', delay);
            localStorage.setItem('currentTopic', currentTopic);
            localStorage.setItem('usedTopics', JSON.stringify(usedTopics));
        }

        // Load state from localStorage
        function loadState() {
            isRunning = localStorage.getItem('isRunning') === 'true';
            currentSearch = parseInt(localStorage.getItem('currentSearch')) || 0;
            totalSearches = parseInt(localStorage.getItem('totalSearches')) || 0;
            delay = parseInt(localStorage.getItem('delay')) || 0;
            currentTopic = localStorage.getItem('currentTopic') || '';
            usedTopics = JSON.parse(localStorage.getItem('usedTopics')) || [];

            if (isRunning) {
                document.getElementById('startBtn').classList.remove('bg-green-500');
                document.getElementById('startBtn').classList.add('bg-gray-500');
                runSearches();
            }
        }

        // Main search function
        async function runSearches() {
            const statusDiv = document.getElementById('status');

            while (currentSearch < totalSearches && isRunning) {
                currentTopic = await fetchTrendingTopic();
                statusDiv.innerHTML = `<p>Searching: ${currentTopic} (${currentSearch + 1}/${totalSearches})</p>`;
                currentSearch++;
                saveState();

                // Open a new tab for the search
                const searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(currentTopic)}`;
                const searchWindow = window.open(searchUrl, '_blank');

                // Wait for the specified delay (with some randomness for safety)
                await new Promise(resolve => setTimeout(resolve, delay + Math.random() * 1000));

                // Close the search tab and return to the main page
                if (searchWindow) {
                    searchWindow.close();
                }

                // Ensure the main page is active
                window.focus();
            }

            // When done
            isRunning = false;
            currentSearch = 0;
            currentTopic = '';
            saveState();
            document.getElementById('startBtn').classList.remove('bg-gray-500');
            document.getElementById('startBtn').classList.add('bg-green-500');
            statusDiv.innerHTML = `<p>Finished ${totalSearches} searches.</p>`;
        }

        // Start Button
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                currentSearch = 0;
                totalSearches = parseInt(document.getElementById('searchCount').value);
                delay = parseInt(document.getElementById('delay').value) * 1000;
                document.getElementById('startBtn').classList.remove('bg-green-500');
                document.getElementById('startBtn').classList.add('bg-gray-500');
                saveState();
                runSearches();
            }
        });

        // Stop Button
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                currentSearch = 0;
                currentTopic = '';
                saveState();
                document.getElementById('startBtn').classList.remove('bg-gray-500');
                document.getElementById('startBtn').classList.add('bg-green-500');
                document.getElementById('status').innerHTML = `<p>Stopped.</p>`;
            }
        });

        // Load state on page load
        window.onload = () => {
            loadState();
        };
    </script>
</body>
</html>
